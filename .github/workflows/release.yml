name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- lib/client.js
      - run: npm run validate:market
      - name: Pack the installable tarball
        run: npm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-grok-byapi $GITHUB_REF_NAME" \
            --generate-notes \
            "${FLAGS[@]}" \
            "dsh-grok-byapi-$VERSION.tgz"
      - name: Publish to npm when a token is configured
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --tag alpha
