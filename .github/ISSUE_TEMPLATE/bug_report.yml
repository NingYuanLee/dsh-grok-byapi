name: Bug report
description: Report a reproducible problem with dsh-grok-byapi
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the problem.
        Do not paste API keys, tokens, or full private URLs.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version shown on the plugin page (for example 0.2.0-alpha.1)
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Desktop app or `dsh --version`
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation / profile loading
        - Chat provider / model discovery
        - Image generation
        - Video generation
        - Text-to-speech
        - Settings page
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behavior, error text, and the tool name or UI action involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant logs
      description: Redact keys and tokens. Plugin logs are prefixed with `grok-byapi:`.
    validations:
      required: false
